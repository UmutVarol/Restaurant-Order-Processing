name: Release

# Pushing a version tag (git tag v1.2.3 && git push origin v1.2.3) publishes a ready-made image, so a restaurant
# installs or updates without building: ./install.sh --image ghcr.io/umutvarol/restaurant-order-processing:1.2.3
# or ./update.sh 1.2.3. Built for ordinary PCs and servers (amd64) and for ARM mini PCs such as a Raspberry Pi
# 4/5 (arm64).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the GitHub release with its notes
      packages: write   # the image on ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/restaurant-order-processing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The same gate as every push: nothing is published that does not pass the full test suite.
      - name: Verify
        run: ./mvnw -B verify

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          image="${IMAGE,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tags=${image}:${version},${image}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes \
            --verify-tag --notes "Install: docs/INSTALL.md. Update an installation: ./update.sh ${GITHUB_REF_NAME#v}"
