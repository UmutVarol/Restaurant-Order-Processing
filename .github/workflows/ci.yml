name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit, integration, architecture and PostgreSQL (Testcontainers) tests, plus the JaCoCo coverage gate.
      - name: Verify
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          path = "target/site/jacoco/jacoco.csv"
          if os.path.exists(path):
              rows = list(csv.DictReader(open(path)))
              total = lambda kind: (sum(int(r[f"{kind}_COVERED"]) for r in rows), sum(int(r[f"{kind}_MISSED"]) for r in rows))
              (lc, lm), (bc, bm) = total("LINE"), total("BRANCH")
              print("### Test coverage")
              print(f"| Lines | Branches |\n|---|---|\n| {lc / (lc + lm):.1%} | {bc / (bc + bm):.1%} |")
          EOF

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/

  e2e:
    name: Browser tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Package the app
        run: ./mvnw -B -DskipTests package

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Playwright starts the packaged jar (demo data on) and drives Chromium at desktop and phone sizes.
      - name: Run browser tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: sofra-restaurant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name sofra -p 8080:8080 -e JWT_SECRET=ci-secret-that-is-long-enough-0123456789 sofra-restaurant:ci
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health/readiness > /dev/null; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'
          curl -fs http://localhost:8080/api/v1/menu | grep -q 'Adana Kebap'
          TOKEN=$(curl -fs -X POST http://localhost:8080/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | python3 -c 'import sys, json; print(json.load(sys.stdin)["accessToken"])')
          curl -fs -H "Authorization: Bearer $TOKEN" "http://localhost:8080/api/v1/analytics/dashboard?days=7" | grep -q '"topItems"'
          echo "Container is healthy and serving the API"

      - name: Container logs
        if: failure()
        run: docker logs sofra
