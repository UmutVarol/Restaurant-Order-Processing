# Production-like stack: the app backed by PostgreSQL, with container hardening from the OWASP Docker
# Security Cheat Sheet (non-root, read-only filesystem, no capabilities, no privilege escalation, resource caps).
#   JWT_SECRET=$(openssl rand -base64 48) docker compose up --build      →  http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sofra
      POSTGRES_USER: sofra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sofra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: only the app container can reach the database.
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofra -d sofra"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: sofra-restaurant:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/sofra
      DATABASE_USERNAME: sofra
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-sofra}
      # With DEMO_MODE=false the app refuses to start on the built-in development key.
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789abcdef}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 2
    pids_limit: 512

volumes:
  pgdata:
