# Production-like stack: the app backed by PostgreSQL, with container hardening from the OWASP Docker
# Security Cheat Sheet (non-root, read-only filesystem, no capabilities, no privilege escalation, resource caps).
#   JWT_SECRET=$(openssl rand -base64 48) docker compose up --build      →  http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sofra
      POSTGRES_USER: sofra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sofra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: only the app container can reach the database.
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofra -d sofra"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: sofra-restaurant:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/sofra
      DATABASE_USERNAME: sofra
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-sofra}
      # With DEMO_MODE=false the app refuses to start on the built-in development key.
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789abcdef}
      DEMO_MODE: ${DEMO_MODE:-true}
      # Online (QR) payments: IYZICO with merchant keys, or NONE. Empty means SIMULATED in demo mode, NONE otherwise.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 2
    pids_limit: 512

  # Nightly backups (docs/OPERATIONS.md): docker compose --profile backup up -d
  # Dumps go to the "backups" volume; copy them off this machine as well (a backup on the same disk is not one).
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: sofra
      PGPASSWORD: ${POSTGRES_PASSWORD:-sofra}
      PGDATABASE: sofra
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_DIR: /backups
      # hour of day (UTC) to run, after the restaurant has closed its day
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - ./ops/backup.sh:/usr/local/bin/sofra-backup:ro
      - ./ops/backup-loop.sh:/usr/local/bin/sofra-backup-loop:ro
      - backups:/backups
    entrypoint: ["bash", "/usr/local/bin/sofra-backup-loop"]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

volumes:
  pgdata:
  backups:
