# Production-like stack: the app backed by PostgreSQL.
#   docker compose up --build      →  http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sofra
      POSTGRES_USER: sofra
      POSTGRES_PASSWORD: sofra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofra -d sofra"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: sofra-restaurant:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/sofra
      DATABASE_USERNAME: sofra
      DATABASE_PASSWORD: sofra
      # Replace with a long random value outside of local experiments.
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789abcdef}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "8080:8080"

volumes:
  pgdata:
