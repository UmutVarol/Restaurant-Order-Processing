spring:
  application:
    name: sofra
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:sofra;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  # Long-running work gives up instead of piling up threads and connections.
  transaction:
    default-timeout: 15s
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 64
        jdbc.time_zone: UTC
        jakarta.persistence.query.timeout: 10000
  data:
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/html,text/css,application/javascript,image/svg+xml
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    # Slow-HTTP ("slowloris") protection: a client must send its request promptly and idle keep-alive
    # connections are closed. Live update streams are unaffected: they are already-accepted async requests.
    connection-timeout: 10s
    keep-alive-timeout: 20s
    max-keep-alive-requests: 200
    max-connections: 4096
    accept-count: 200
    max-http-form-post-size: 64KB
    max-swallow-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN
  info:
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
  paths-to-match: /api/**

restaurant:
  name: Sofra Bistro
  time-zone: Europe/Istanbul
  pricing:
    tax-rate: 0.10
    delivery-fee: 39.90
    free-delivery-threshold: 750.00
  security:
    jwt:
      # Development-only default. Always provide JWT_SECRET (32+ characters) in real deployments.
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
      issuer: sofra
      audience: sofra-api
      time-to-live: 8h
    # Abuse protection (see AbuseProtectionProperties): per-account lockout and per-client rate limits.
    login:
      max-failures: 5
      observation-window: 15m
      base-lockout: 30s
      max-lockout: 15m
    rate-limit:
      enabled: true
      api-requests-per-minute: 600
      login-requests-per-minute: 60
      # Guest payment pages, provider callbacks and notifications, browser security reports.
      public-requests-per-minute: 120
      # Signed order webhooks from delivery platforms.
      channel-requests-per-minute: 300
    max-request-body: 64KB
    # Refunds and closing the day need a sign-in at most this old (step-up authentication).
    step-up-window: 5m
    # Two-step sign-in (TOTP) for managers; the key encrypts the stored secrets (openssl rand -base64 32).
    totp:
      encryption-key: ${TOTP_ENCRYPTION_KEY:}
      required-for-managers: ${TOTP_REQUIRED_FOR_MANAGERS:false}
  realtime:
    max-subscribers: 500
    max-subscribers-per-user: 10
  payments:
    # NONE, SIMULATED or IYZICO. Empty: SIMULATED in demo mode, NONE otherwise.
    provider: ${PAYMENT_PROVIDER:}
    # The address guests reach the app on (QR links, provider callbacks). Empty: taken from the request.
    public-base-url: ${PUBLIC_BASE_URL:}
    link-ttl: 2h
    pending-ttl: 30m
    iyzico:
      api-key: ${IYZICO_API_KEY:}
      secret-key: ${IYZICO_SECRET_KEY:}
      base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
  # Delivery platforms. A platform with a webhook secret is connected; without one it is simulated in demo mode
  # and switched off otherwise. The API settings are where status and availability updates are sent.
  channels:
    webhook-tolerance: 5m
    yemeksepeti:
      webhook-secret: ${YEMEKSEPETI_WEBHOOK_SECRET:}
      api-base-url: ${YEMEKSEPETI_API_BASE_URL:}
      api-token: ${YEMEKSEPETI_API_TOKEN:}
    getir:
      webhook-secret: ${GETIR_WEBHOOK_SECRET:}
      api-base-url: ${GETIR_API_BASE_URL:}
      api-token: ${GETIR_API_TOKEN:}
    trendyol:
      webhook-secret: ${TRENDYOL_WEBHOOK_SECRET:}
      api-base-url: ${TRENDYOL_API_BASE_URL:}
      api-token: ${TRENDYOL_API_TOKEN:}
  demo:
    enabled: ${DEMO_MODE:true}
    history-days: 14

logging:
  level:
    org.hibernate.orm.deprecation: error
