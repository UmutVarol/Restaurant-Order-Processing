# Activate with SPRING_PROFILES_ACTIVE=postgres (see docker-compose.yml).
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sofra}
    username: ${DATABASE_USERNAME:sofra}
    password: ${DATABASE_PASSWORD:sofra}
    hikari:
      maximum-pool-size: 10
      # Fail fast when the database is unreachable instead of hanging requests for 30 s.
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
