spring:
  datasource:
    # A fresh in-memory database per application context keeps test classes independent.
    url: jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

restaurant:
  demo:
    enabled: false
  payments:
    provider: SIMULATED
    allow-simulated: true
  security:
    jwt:
      secret: test-secret-that-is-long-enough-for-hs256-0123456789
    # The whole suite runs from one address; dedicated tests cover the limits with tight values.
    rate-limit:
      api-requests-per-minute: 1000000
      login-requests-per-minute: 1000000
      public-requests-per-minute: 1000000
    # Tokens are cached for the whole test run; a dedicated test covers the step-up window.
    step-up-window: 1h

logging:
  level:
    root: warn
